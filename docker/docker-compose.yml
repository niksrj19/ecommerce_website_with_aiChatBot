version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: aegis_redis_insight
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
  redis_insight_data: